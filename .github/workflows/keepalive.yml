name: Keepalive

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase through the app
        run: curl --fail --silent --show-error -H "Authorization: Bearer ${CRON_SECRET}" "${APP_URL}/api/cron/keepalive"
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
